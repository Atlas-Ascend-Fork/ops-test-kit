[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ttk"
version = "2.8.0"
description = "TTK — Tensor Tool Kit, Ascend NPU single-operator testing framework"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0 AND CANN-OSL-2.0 (see LICENSE and LICENSE.CANN)" }
authors = [
    { name = "Huawei Technologies Co., Ltd." },
]
keywords = ["ascend", "npu", "tbe", "operator-test", "cann"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
    "Private :: Do Not Upload",
]

dependencies = [
    "numpy>=1.19,<2.0",
    "psutil>=5.7",
    "attrs>=21",
    "decorator>=4",
    "six>=1.15",
    "sympy",
    "jinja2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
tf = ["tensorflow>=2.12"]
torch = ["torch>=2.0"]
e2e-npu = ["torch>=2.0", "torch_npu>=2.1"]
e2e-xpu = ["torch>=2.0"]
dev = [
    "pytest>=7",
    "pytest-cov",
    "mypy",
    "ruff",
]
all = [
    "ttk[tf]",
    "ttk[torch]",
    "ttk[e2e-npu]",
]

[project.scripts]
ttk = "ttk.cli:main"

[project.urls]
Homepage = "https://gitcode.com/cann/ops-test-kit"
Documentation = "https://gitcode.com/cann/ops-test-kit/tree/master/docs"
Issues = "https://gitcode.com/cann/ops-test-kit/issues"

[tool.setuptools]
packages = { find = { include = ["ttk*"], exclude = ["tests*", "examples*"] } }
include-package-data = true

[tool.setuptools.cmdclass]
build_py = "ttk._version.BuildPyWithBuild"

[tool.setuptools.package-data]
"ttk" = [
    "user_defined_modules/**/*.json",
    "user_defined_modules/**/*.yaml",
    "user_defined_modules/**/*.cce",
    "core_modules/**/*.json",
]

[tool.ruff]
line-length = 120
target-version = "py38"
extend-exclude = [
    "examples",
    "ops-decoupling-workspace",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "S",      # flake8-bandit
    "FA",     # flake8-future-annotations
    "PL",     # pylint
]
ignore = [
    # 基础
    "E501",       # 行长度交给 format 控制

    # 中文项目适配
    "RUF001",     # 字符串中的歧义 Unicode（中文误报）
    "RUF002",     # 文档字符串中的歧义 Unicode（中文误报）
    "RUF003",     # 注释中的歧义 Unicode（中文误报）

    # 项目架构适配
    "PLC0415",    # 允许延迟导入（torch/tf 为可选依赖）
    "PLW0603",    # 允许 global 语句
    "PLR0913",    # 允许超过 5 个参数（算子接口天然多参数）
    "PLR0912",    # 允许过多分支
    "PLR0915",    # 允许过多语句
    "PLR0911",    # 允许过多 return（多分支 API 解析器天然多返回路径）

    # 安全规则白名单
    "S603",       # subprocess 调用允许（工具属性决定）
    "S607",       # 允许 PATH 中查找可执行文件
    "S101",       # 允许 assert（测试代码大量使用）
    "S108",       # 允许 /tmp 路径

    # 渐进式忽略
    "FA100",      # 不强制要求 from __future__ import annotations
    "PLR2004",    # 允许魔法数字
    "RET504",     # 允许 return 前赋值
]

[tool.ruff.lint.per-file-ignores]
"ttk/core_modules/**/__init__.py" = ["F401", "F403"]
"tests/**" = ["S101", "S108", "S301", "PT014"]

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
files = ["ttk"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
markers = [
    "slow: mark test as slow (deselect with '-m \"not slow\"')",
    "device: test requires NPU device attached",
    "e2e: end-to-end test (kernel compile + XPU dispatch, needs NPU)",
]
